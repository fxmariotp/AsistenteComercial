<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Comercial - Asistente Comercial</title>
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #141a3b; /* Renosur Navy background */
      --blue: #357FBF; /* Renosur Blue */
      --blue2: #5aa5df; /* Renosur Sky Blue */
      --rs: 10px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #FFFAF6 0%, #F5EFEB 100%);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }
    /* Ambient glows for warm premium feel */
    body::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(53, 127, 191, 0.07) 0%, transparent 70%);
      top: -10%;
      left: -10%;
      z-index: 0;
    }
    body::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(249, 115, 22, 0.05) 0%, transparent 70%);
      bottom: -10%;
      right: -10%;
      z-index: 0;
    }
    #login-container {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      z-index: 1;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 24px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(120, 110, 100, 0.12), 0 2px 8px rgba(0, 0, 0, 0.02);
      text-align: center;
      animation: loginAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes loginAppear {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .login-logo {
      width: 64px;
      height: 64px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .login-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .login-title {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .login-sub {
      font-size: 14px;
      color: #475569;
      margin-bottom: 28px;
    }
    .login-field {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      text-align: left;
      gap: 6px;
    }
    .login-field label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #475569;
      padding-left: 4px;
    }
    .login-field input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid rgba(0, 0, 0, 0.08);
      border-radius: var(--rs);
      font-size: 15px;
      background: rgba(255, 255, 255, 0.8);
      color: #0f172a;
      outline: none;
      transition: all 0.2s;
    }
    .login-field input:focus {
      border-color: var(--blue);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(53, 127, 191, 0.15);
    }
    .login-field input::placeholder {
      color: #94a3b8;
    }
    .login-error {
      color: #ef4444;
      font-size: 13px;
      margin-top: 12px;
      font-weight: 600;
      min-height: 20px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: var(--rs);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(53, 127, 191, 0.15);
      width: 100%;
      height: 46px;
      margin-top: 8px;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(53, 127, 191, 0.25);
    }
    .btn-primary:active {
      transform: translateY(0);
    }
    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
  </style>
</head>
<body>

<div id="login-container">
  <div class="login-card">
    <div class="login-logo">
      <img src="favicon.png?v=2" alt="Renosur Logo">
    </div>
    <h2 class="login-title">Acceso Comercial</h2>
    <p class="login-sub">Introduce tus credenciales para acceder</p>
    
    <div class="login-field">
      <label for="login-dni">Usuario (DNI)</label>
      <input type="text" id="login-dni" placeholder="Escribe tu DNI (p. ej. 12345678A)" autocomplete="off" autofocus>
    </div>
    
    <div class="login-field">
      <label for="login-password">Contrase&ntilde;a</label>
      <input type="password" id="login-password" placeholder="Introduce tu contrase&ntilde;a" autocomplete="off">
    </div>
    
    <button class="btn-primary" id="login-submit" onclick="attemptLogin()">Acceder</button>
    <div class="login-error" id="login-error-msg"></div>
  </div>
</div>

<script>
const COMERCIALES = {
  "47539234M": "ANA ROCIO GALERA MORILLO",
  "28727453Q": "BEGOÑA CABANILLAS PIQUERO",
  "47269867Z": "CHRISTIAN CABRERA MARQUEZ",
  "77976681B": "CLARA TORREÑO RUIZ",
  "28818524F": "CRISTINA SANTOS LARIOS",
  "77860623B": "FRANCISCO MORENTE",
  "47269866J": "JOSE MIGUEL CABRERA MARQUEZ",
  "51997096F": "MANUELA SALAZAR CORTES",
  "29537747C": "MARINA MARTINEZ DE LA ROSA",
  "77822813J": "MARIO TIBURCIO PORRAS",
  "30369873Y": "MERCEDES TERRON DIEZ",
  "53283415M": "MÓNICA CEJUDO HIDALGO",
  "MIGUELR": "MIGUEL RODRIGUEZ FLORES",
  "MARIAC": "MARIA CABRERA",
  "28750523V": "OLGA VILLA",
  "29502580C": "LIBRERO",
  "53343101Y": "NURIA CEBALLOS DURAN"
};

const SUPABASE_URL = "https://bxgdtdzlijeaetlekbub.supabase.co";
const SUPABASE_KEY = "sb_publishable_DlLT2Rz1npEXSuxpM9__tQ_WF-Q0-Ap";
const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

// Check if user is already logged in
const dni = localStorage.getItem('comercial_dni');
const name = localStorage.getItem('comercial_nombre');
if (dni && name && COMERCIALES[dni] === name) {
  window.location.href = 'index.html';
}

async function detectClientDeviceInfo() {
  let publicIp = 'Desconocida';
  
  // 1. Consultar múltiples proveedores de IP pública en paralelo con fallback inmediato y seguro
  const fetchIpHelper = (url, parseJson = true) => {
    return new Promise(resolve => {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 2000);
      fetch(url, { signal: controller.signal })
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return parseJson ? res.json() : res.text();
        })
        .then(data => {
          clearTimeout(timeoutId);
          if (parseJson) {
            const ip = data && (data.ip || data.query);
            if (ip && typeof ip === 'string') resolve(ip.trim());
            else resolve(null);
          } else {
            if (data && typeof data === 'string' && data.trim()) resolve(data.trim());
            else resolve(null);
          }
        })
        .catch(() => {
          clearTimeout(timeoutId);
          resolve(null);
        });
    });
  };

  try {
    const results = await Promise.allSettled([
      fetchIpHelper('https://api.ipify.org?format=json', true),
      fetchIpHelper('https://api64.ipify.org?format=json', true),
      fetchIpHelper('https://api.my-ip.io/v2/ip.json', true),
      fetchIpHelper('https://icanhazip.com', false)
    ]);

    for (const r of results) {
      if (r.status === 'fulfilled' && r.value) {
        publicIp = r.value;
        break;
      }
    }
  } catch (_) {}

  let userAgent = navigator.userAgent || 'Desconocido';
  if (userAgent.length > 150) {
    userAgent = userAgent.substring(0, 150) + '...';
  }

  const screenRes = (window.screen && window.screen.width && window.screen.height) 
    ? `${window.screen.width}x${window.screen.height}` 
    : '';

  const dpr = window.devicePixelRatio ? Math.round(window.devicePixelRatio * 10) / 10 : 1;
  const touchPoints = navigator.maxTouchPoints || 0;

  // Detección de Safe Area (Notch vs Isla Dinámica en iPhone 14 Pro / 15 / 16)
  let safeAreaTop = 0;
  try {
    if (document.body) {
      const testDiv = document.createElement('div');
      testDiv.style.cssText = 'position:fixed;top:0;left:-9999px;padding-top:env(safe-area-inset-top, 0px);visibility:hidden;pointer-events:none;';
      document.body.appendChild(testDiv);
      const computed = window.getComputedStyle(testDiv).paddingTop;
      safeAreaTop = parseInt(computed, 10) || 0;
      document.body.removeChild(testDiv);
    }
  } catch (_) {}

  let gpuRenderer = '';
  try {
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (gl) {
      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      if (debugInfo) {
        gpuRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || '';
      }
    }
  } catch (_) {}

  let clientModel = '';
  if (navigator.userAgentData && typeof navigator.userAgentData.getHighEntropyValues === 'function') {
    try {
      const entropy = await navigator.userAgentData.getHighEntropyValues(['model', 'platform', 'platformVersion']);
      if (entropy && entropy.model) {
        clientModel = entropy.model;
      }
    } catch (_) {}
  }

  return {
    publicIp: publicIp || 'Desconocida',
    userAgent: userAgent,
    screenRes: screenRes,
    dpr: dpr,
    safeAreaTop: safeAreaTop,
    touchPoints: touchPoints,
    gpuRenderer: gpuRenderer,
    clientModel: clientModel
  };
}

async function writeLoginLogToSupabase(dni, name) {
  if (!supabaseClient) return;
  
  try {
    const clientInfo = await detectClientDeviceInfo();
    const now = new Date();
    const dateStr = now.toLocaleDateString('en-CA');
    const timeStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    const logId = 'login_log_' + dni + '_' + Date.now();
    
    let notesStr = clientInfo.userAgent;
    if (clientInfo.screenRes) notesStr += ` ###SCREEN###:${clientInfo.screenRes}`;
    if (clientInfo.dpr) notesStr += ` ###DPR###:${clientInfo.dpr}`;
    if (clientInfo.safeAreaTop) notesStr += ` ###INSET###:${clientInfo.safeAreaTop}`;
    if (clientInfo.clientModel) notesStr += ` ###MODEL###:${clientInfo.clientModel}`;
    if (clientInfo.gpuRenderer) notesStr += ` ###GPU###:${clientInfo.gpuRenderer}`;
    if (clientInfo.touchPoints > 0) notesStr += ` ###TOUCH###:${clientInfo.touchPoints}`;

    const { error } = await supabaseClient.from('tareas').insert({
      id: logId,
      dni: 'SYSTEM_LOGIN_LOG',
      title: dni,
      type: name,
      phone: clientInfo.publicIp,
      date: dateStr,
      time: timeStr,
      notes: notesStr,
      completed: true,
      notified: false,
      created_at: Date.now()
    });
    if (error) console.error("Error writing login log to Supabase:", error);
  } catch (e) {
    console.error("Exception writing login log to Supabase:", e);
  }
}

async function attemptLogin() {
  const submitBtn = document.getElementById('login-submit');
  const errorMsg = document.getElementById('login-error-msg');
  
  const inputDni = document.getElementById('login-dni').value.trim().toUpperCase();
  const inputPass = document.getElementById('login-password').value;
  
  if (!inputDni || !inputPass) {
    errorMsg.textContent = "Por favor, introduce tu DNI y contraseña.";
    return;
  }
  
  const matchedName = COMERCIALES[inputDni];
  if (!matchedName) {
    errorMsg.textContent = "El DNI introducido no corresponde a ningún comercial.";
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.textContent = "Accediendo...";
  
  let validPassword = inputDni;
  let userStatus = 'active';
  
  if (supabaseClient) {
    try {
      const { data, error } = await supabaseClient
        .from('agentes_roles')
        .select('rol')
        .eq('dni', inputDni)
        .maybeSingle();
      
      if (!error && data && data.rol) {
        const roleStr = data.rol;
        if (roleStr.includes(':')) {
          const parts = roleStr.split(':');
          const lastPart = parts[parts.length - 1];
          if (lastPart === 'active' || lastPart === 'inactive') {
            userStatus = lastPart;
            validPassword = parts.slice(1, parts.length - 1).join(':') || inputDni;
          } else {
            validPassword = parts.slice(1).join(':');
          }
        }
      }
    } catch (e) {
      console.error("Error connecting to Supabase for auth:", e);
    }
  }
  
  submitBtn.disabled = false;
  submitBtn.textContent = "Acceder";
  
  if (userStatus === 'inactive') {
    errorMsg.textContent = "Tu cuenta de agente está desactivada. Contacta con gerencia.";
    return;
  }
  
  if (inputPass === validPassword) {
    const now = Date.now();
    const todayStr = new Date().toLocaleDateString('en-CA');
    localStorage.setItem('comercial_dni', inputDni);
    localStorage.setItem('comercial_nombre', matchedName);
    localStorage.setItem('last_user_activity_' + inputDni, String(now));
    localStorage.setItem('last_connection_date_' + inputDni, todayStr);
    sessionStorage.setItem('session_logged_' + inputDni, String(now));
    errorMsg.textContent = "";
    
    writeLoginLogToSupabase(inputDni, matchedName).finally(() => {
      window.location.href = 'index.html';
    });
  } else {
    errorMsg.textContent = "La contraseña introducida es incorrecta.";
  }
}

// Bind enter key
document.getElementById('login-dni').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    attemptLogin();
  }
});
document.getElementById('login-password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    attemptLogin();
  }
});
</script>
</body>
</html>
